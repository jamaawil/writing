[build]
  command = "npm run build"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # SQLite (WebAssembly) reads the research database from Cloudflare R2.
  external_node_modules = ["@journeyapps/wa-sqlite"]
  included_files = ["node_modules/@journeyapps/wa-sqlite/dist/wa-sqlite-async.*", "node_modules/@journeyapps/wa-sqlite/src/**"]

# Stable record URLs share one application shell. Entity identities, not titles,
# determine the destination; renaming a note does not break a research link.
[[redirects]]
  from = "/zettel/research/*"
  to = "/zettel/research/index.html"
  status = 200

[[redirects]]
  from = "/Zettlr"
  to = "/zettel/"
  status = 301

[[redirects]]
  from = "/Zettlr/*"
  to = "/zettel/research/?reference=:splat"
  status = 301

[[redirects]]
  from = "/Digitalmind/*"
  to = "/zettel/research/?reference=:splat"
  status = 301

# Friendly API paths used by the client (comments.js / main.js) mapped to the
# actual function names. These specific rules MUST come before the /api/* catch-all
# (Netlify uses the first matching rule).
[[redirects]]
  from = "/api/comments"
  to = "/.netlify/functions/comments-get"
  status = 200

[[redirects]]
  from = "/api/comment"
  to = "/.netlify/functions/comment-post"
  status = 200


[[redirects]]
  from = "/api/research-asset"
  to = "/.netlify/functions/research-asset"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
